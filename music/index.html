<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diffusion</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://diffusiondj.com/">
    <!-- The script runs first and carries the #show/<slug> hash across, which a
         meta refresh cannot; the refresh only covers browsers with scripts off. -->
    <script>location.replace("http://diffusiondj.com/" + location.hash);</script>
    <meta http-equiv="refresh" content="0; url=http://diffusiondj.com/">
</head>
<body>
    <p>Diffusion has moved to <a href="http://diffusiondj.com/">diffusiondj.com</a>.</p>
</body>
</html>
