<!-- Personal site mark: a brain, side view. Detail is the enemy at 16px, so the
     folds are only two thick cuts in a solid silhouette — enough to read as a
     brain, few enough to survive downsampling. Blue carries over from the
     monitor favicon this replaces. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1a1c21"/>
  <g fill="#6aa8e0">
    <!-- Silhouette: overlapping lobes, bumpy along the top, notched at the
         bottom right where the stem drops. Same fill, so they union visually. -->
    <circle cx="12" cy="12.4" r="5.4"/>
    <circle cx="19.4" cy="12" r="5.2"/>
    <circle cx="11.4" cy="18.4" r="5"/>
    <circle cx="18.6" cy="18.2" r="4.8"/>
    <circle cx="22.4" cy="15.6" r="3.6"/>
    <circle cx="8.6" cy="15.4" r="3.8"/>
  </g>
  <!-- Folds cut back to the tile colour rather than drawn over it: at small sizes
       a negative groove holds its shape better than a positive line. -->
  <g fill="none" stroke="#1a1c21" stroke-width="1.9" stroke-linecap="round">
    <path d="M15.6 7.8v14.4"/>
    <path d="M11.2 11.4c2.2.9 2.2 3 0 4"/>
    <path d="M20.1 11.2c-2.2.9-2.2 3 0 4"/>
    <path d="M11.6 18.6c2 .8 2 2.4 0 3.1"/>
    <path d="M19.7 18.4c-2 .8-2 2.4 0 3.1"/>
  </g>
</svg>
